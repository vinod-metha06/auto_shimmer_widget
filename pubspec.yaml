name: auto_shimmer_widget
description: Automatic Flutter shimmer skeleton loader from existing widgets with RTL, dark mode, list, grid, and animation support.
version: 0.0.1

homepage: https://github.com/vinod-metha06/auto_shimmer_widget
repository: https://github.com/vinod-metha06/auto_shimmer_widget
issue_tracker: https://github.com/vinod-metha06/auto_shimmer_widget/issues

topics:
  - shimmer
  - skeleton
  - loading
  - placeholder
  - flutter

screenshots:
  - description: Auto Shimmer Widget logo
    path: screenshots/logo.png
  - description: Light mode shimmer preview
    path: screenshots/light_mode_preview.png
  - description: Dark mode shimmer preview
    path: screenshots/dark_mode_preview.png
  - description: Arabic RTL shimmer preview
    path: screenshots/arabic_rtl_preview.png
  - description: List and grid shimmer preview
    path: screenshots/list_grid_preview.png

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
